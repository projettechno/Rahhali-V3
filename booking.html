  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="nav-fixed scrolled" id="navbar">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">

        <a href="index.html" class="nav-link">Home</a>
        <a href="tours.html" class="nav-link active">Tours</a>

        <a href="reviews.html" class="nav-link">Reviews</a>

  <div class="mobile-menu" id="mobile-menu">
    <button class="absolute top-5 right-5 text-cream p-1" onclick="toggleMobileMenu()"><i data-lucide="x" class="w-6 h-6"></i></button>
    <div class="flex flex-col items-center mb-2"><div class="nav-brand-icon" style="width:40px;height:30px;margin-bottom:0.8rem;"></div><div style="font-family:'Playfair Display',serif;font-size:1.4rem;color:#C8A96E;letter-spacing:0.3em;text-transform:uppercase;">Rahhali</div></div>
    <a href="index.html" class="mobile-link" onclick="toggleMobileMenu()">Home</a>
    <a href="tours.html" class="mobile-link" onclick="toggleMobileMenu()">Tours</a>
    <a href="about.html" class="mobile-link" onclick="toggleMobileMenu()">About</a>
    <a href="reviews.html" class="mobile-link" onclick="toggleMobileMenu()">Reviews</a>
    <a href="contact.html" class="mobile-link" onclick="toggleMobileMenu()">Contact</a>
  </div>

  <section class="page-header px-4 sm:px-6">
    <div class="max-w-7xl mx-auto text-center fade-up">
      <p class="text-gold text-xs font-bold tracking-[0.3em] uppercase mb-3" style="font-size:0.6rem;">Complete Your Booking</p>
      <h2 class="font-display text-3xl sm:text-4xl md:text-5xl text-white mb-2" id="booking-page-title"></h2>
      <p class="text-cream-muted text-sm" id="booking-page-subtitle"></p>
    </div>
  </section>

  <section class="px-4 sm:px-6 py-10 sm:py-14">
    <div class="max-w-xl mx-auto fade-up">
      <div class="gold-line-left mb-6" style="width:35px;"></div>
      <form id="booking-form" class="space-y-4">
        <div>
          <label class="form-label">Full Name *</label>
          <input type="text" class="form-input" id="booking-name" placeholder="Your full name" required>
        </div>
        <div>
          <label class="form-label">Email *</label>
          <input type="email" class="form-input" id="booking-email" placeholder="your@email.com" required>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="form-label">Participants *</label>
            <input type="number" class="form-input" id="booking-participants" min="1" max="20" value="2" required>
          </div>
          <div>
            <label class="form-label">Phone</label>
            <input type="tel" class="form-input" id="booking-phone" placeholder="+212 6XX XXX XXX">
          </div>
        </div>
        <div>
          <label class="form-label">Preferred Date *</label>
          <input type="date" class="form-input" id="booking-date" required>
        </div>
        <div>
          <label class="form-label">Special Requests</label>
          <textarea class="form-input" id="booking-requests" placeholder="Dietary needs, celebrations, accessibility..." style="min-height:70px;"></textarea>
        </div>
        <div class="pt-2 space-y-2.5">
          <button type="button" class="btn-gold w-full" onclick="doBooking('whatsapp')">
            <i data-lucide="message-circle" class="w-3.5 h-3.5"></i> Book via WhatsApp
          </button>
          <button type="button" class="btn-outline w-full" onclick="doBooking('email')">
            <i data-lucide="mail" class="w-3.5 h-3.5"></i> Book via Email
          </button>
        </div>
      </form>
      <div class="mt-6">
        <a href="tours.html" class="btn-outline w-full" style="display:inline-flex;">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Back to Tours
        </a>
      </div>
    </div>
  </section>

  <a href="https://wa.me/212644182733?text=Hello%20Rahhali%20Luxury%20Travel%2C%20I%27d%20like%20to%20inquire%20about%20your%20tours." target="_blank" class="whatsapp-float" aria-label="WhatsApp"><svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg></a>

  <footer class="border-t border-dark-border px-4 sm:px-6 py-12 relative z-10">
    <div class="max-w-7xl mx-auto">
      <div class="border-t border-dark-border pt-7 flex flex-col sm:flex-row items-center justify-between gap-3">
        <p class="text-cream-muted text-xs tracking-wider">&copy; 2025 Rahhali Luxury Travel. All rights reserved.</p>
        <div class="flex items-center gap-5"><a href="#" class="text-cream-muted hover:text-gold transition-colors"><i data-lucide="instagram" class="w-4 h-4"></i></a><a href="#" class="text-cream-muted hover:text-gold transition-colors"><i data-lucide="facebook" class="w-4 h-4"></i></a><a href="https://wa.me/212644182733" target="_blank" class="text-cream-muted hover:text-gold transition-colors"><i data-lucide="message-circle" class="w-4 h-4"></i></a></div>
      </div>
    </div>
  </footer>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/data.js"></script>
  <script>
    function toggleMobileMenu(){document.getElementById('mobile-menu').classList.toggle('open');}
    function observeFadeUps(){var o=new IntersectionObserver(function(e){for(var i=0;i<e.length;i++){if(e[i].isIntersecting){e[i].target.classList.add('visible');o.unobserve(e[i].target);}}},{threshold:0.08});var els=document.querySelectorAll('.fade-up:not(.visible)');for(var i=0;i<els.length;i++)o.observe(els[i]);}

    var params=new URLSearchParams(window.location.search);
    var tourId=parseInt(params.get('id'));
    var tour=null;
    for(var i=0;i<tours.length;i++){if(tours[i].id===tourId){tour=tours[i];break;}}

    if(tour){
      document.title='Book: '+tour.title+' — Rahhali Luxury Travel';
      document.getElementById('booking-page-title').textContent=tour.title;
      document.getElementById('booking-page-subtitle').textContent=tour.duration+' \u2014 '+tour.price;
    } else {
      document.getElementById('booking-page-title').textContent='Booking';
      document.getElementById('booking-page-subtitle').textContent='Tour not specified';
    }

    function doBooking(method){
      var name=document.getElementById('booking-name').value.trim();
      var email=document.getElementById('booking-email').value.trim();
      var participants=document.getElementById('booking-participants').value;
      var date=document.getElementById('booking-date').value;
      var endDate=document.getElementById('booking-end-date').value;
      var phone=document.getElementById('booking-phone').value.trim();
      var requests=document.getElementById('booking-requests').value.trim();
      if(!name||!email||!participants||!date){showToast('Please fill in all required fields.','warning');return;}
      if(!tour){showToast('Tour not found.','warning');return;}
      var msg='\u2708\uFE0F *New Booking \u2014 Rahhali Luxury Travel*\n\n\u25B9 *Tour:* '+tour.title+'\n\u25B9 *Duration:* '+tour.duration+'\n\u25B9 *Price:* '+tour.price+'\n\n\uD83D\uDC64 *Client:* '+name+'\n\uD83D\uDCE7 *Email:* '+email+'\n\uD83D\uDCF1 *Phone:* '+(phone||'Not provided')+'\n\uD83D\uDC65 *Participants:* '+participants+'\n\uD83D\uDCC5 *Start:* '+date+'\n\uD83D\uDCC5 *End:* '+(endDate||'Not specified')+'\n\n\uD83D\uDCAC *Special Requests:*\n'+(requests||'None')+'\n\n---\nSent via Rahhali Luxury Travel Website';
      if(method==='whatsapp'){
        window.open('https://wa.me/212644182733?text='+encodeURIComponent(msg),'_blank');
        showToast('Opening WhatsApp with your booking details...','success');
      } else {
        window.location.href='mailto:rahhaliluxrytravel@gmail.com?subject='+encodeURIComponent('Booking Inquiry: '+tour.title)+'&body='+encodeURIComponent(msg.replace(/\*/g,''));
        showToast('Opening your email client...','success');
      }
    }

    function showToast(message,type){
      type=type||'info';var container=document.getElementById('toast-container');
      var toast=document.createElement('div');toast.className='toast';
      var icons={success:'<svg class="w-5 h-5 text-gold flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>',warning:'<svg class="w-5 h-5 text-yellow-500 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/></svg>'};
      toast.innerHTML=(icons[type]||icons.success)+'<span>'+message+'</span>';
      container.appendChild(toast);
      setTimeout(function(){toast.classList.add('removing');setTimeout(function(){toast.remove();},300);},4500);
    }

    window.addEventListener('load',function(){lucide.createIcons();observeFadeUps();});
  </script>
</body>
</html>
