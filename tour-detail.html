<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tour Details — Rahhali Luxury Travel</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>tailwind.config={theme:{extend:{colors:{gold:{DEFAULT:'#C8A96E',light:'#D4B87A',dark:'#A8894A'},dark:{DEFAULT:'#0A0A0A',card:'#141414',border:'#2A2A2A',elevated:'#1A1A1A'},cream:{DEFAULT:'#E8E2D8',light:'#F5F0E8',muted:'#B8B0A4'}},fontFamily:{display:['Playfair Display','serif'],body:['Lato','sans-serif']}}}}</script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="nav-fixed scrolled" id="navbar">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
      <a href="index.html" class="nav-brand"><div class="nav-brand-icon"></div><div><div class="nav-brand-text">Rahhali</div></div></a>
      <div class="hidden md:flex items-center gap-7">
        <a href="index.html" class="nav-link">Home</a>
        <a href="tours.html" class="nav-link active">Tours</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="reviews.html" class="nav-link">Reviews</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </div>
      <button class="md:hidden text-cream p-1" onclick="toggleMobileMenu()" aria-label="Menu"><i data-lucide="menu" class="w-5 h-5"></i></button>
    </div>
  </nav>

  <div class="mobile-menu" id="mobile-menu">
    <button class="absolute top-5 right-5 text-cream p-1" onclick="toggleMobileMenu()"><i data-lucide="x" class="w-6 h-6"></i></button>
    <div class="flex flex-col items-center mb-2"><div class="nav-brand-icon" style="width:40px;height:30px;margin-bottom:0.8rem;"></div><div style="font-family:'Playfair Display',serif;font-size:1.4rem;color:#C8A96E;letter-spacing:0.3em;text-transform:uppercase;">Rahhali</div></div>
    <a href="index.html" class="mobile-link" onclick="toggleMobileMenu()">Home</a>
    <a href="tours.html" class="mobile-link" onclick="toggleMobileMenu()">Tours</a>
    <a href="about.html" class="mobile-link" onclick="toggleMobileMenu()">About</a>
    <a href="reviews.html" class="mobile-link" onclick="toggleMobileMenu()">Reviews</a>
    <a href="contact.html" class="mobile-link" onclick="toggleMobileMenu()">Contact</a>
  </div>

  <!-- TOUR HERO -->
  <div class="tour-hero" id="tour-hero">
    <img id="tour-hero-img" src="" alt="">
    <div class="absolute bottom-6 left-6 right-6 z-10">
      <p class="text-gold text-xs font-bold tracking-[0.2em] uppercase mb-1" style="font-size:0.6rem;" id="tour-hero-subtitle"></p>
      <h1 class="font-display text-3xl sm:text-4xl md:text-5xl text-white" id="tour-hero-title"></h1>
    </div>
  </div>

  <!-- TOUR INFO BAR -->
  <div class="bg-dark-card border-b border-dark-border px-4 sm:px-6">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center gap-4 sm:gap-8 py-5">
      <span class="flex items-center gap-2 text-cream-muted text-sm" id="tour-info-duration"><i data-lucide="clock" class="w-4 h-4 text-gold"></i> </span>
      <span class="flex items-center gap-1 text-sm" id="tour-info-stars"></span>
      <span class="text-gold font-bold text-lg sm:text-xl ml-auto" id="tour-info-price"></span>
    </div>
  </div>

  <!-- TOUR CONTENT -->
  <section class="px-4 sm:px-6 py-10 sm:py-14">
    <div class="max-w-7xl mx-auto">
      <!-- Description -->
      <div class="max-w-3xl mb-12 fade-up">
        <p class="text-cream-muted leading-relaxed text-sm sm:text-base" id="tour-description"></p>
      </div>

      <!-- Itinerary -->
      <div class="mb-12 fade-up" id="tour-itinerary-section" style="display:none;">
        <h3 class="text-cream text-xs font-bold tracking-[0.15em] uppercase mb-6" style="font-size:0.65rem;">Itinerary</h3>
        <div id="tour-itinerary"></div>
      </div>

      <!-- Gallery -->
      <div class="mb-12 fade-up">
        <h3 class="text-cream text-xs font-bold tracking-[0.15em] uppercase mb-4" style="font-size:0.65rem;">Gallery</h3>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3" id="tour-gallery"></div>
      </div>

      <!-- Highlights & Inclusions -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-12 fade-up">
        <div>
          <h3 class="text-cream text-xs font-bold tracking-[0.15em] uppercase mb-4" style="font-size:0.65rem;">Highlights</h3>
          <ul class="space-y-2" id="tour-highlights"></ul>
        </div>
        <div>
          <h3 class="text-cream text-xs font-bold tracking-[0.15em] uppercase mb-4" style="font-size:0.65rem;">Inclusions</h3>
          <ul class="space-y-2" id="tour-inclusions"></ul>
        </div>
      </div>

      <!-- Back & Book -->
      <div class="flex flex-col sm:flex-row gap-3 fade-up">
        <a href="tours.html" class="btn-outline"><i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> All Tours</a>
        <a href="#" class="btn-gold" id="tour-book-btn">Book This Experience <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i></a>
      </div>
    </div>
  </section>

  <!-- More Tours -->
  <section class="px-4 sm:px-6 py-14" style="background:linear-gradient(to bottom,#0A0A0A,#0E0E0E,#0A0A0A);">
    <div class="max-w-7xl mx-auto">
      <div class="text-center mb-10 fade-up">
        <p class="text-gold text-xs font-bold tracking-[0.3em] uppercase mb-3" style="font-size:0.6rem;">You May Also Like</p>
        <h2 class="font-display text-2xl sm:text-3xl text-white">More Experiences</h2>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5 fade-up" id="related-tours"></div>
    </div>
  </section>

  <a href="https://wa.me/212644182733?text=Hello%20Rahhali%20Luxury%20Travel%2C%20I%27d%20like%20to%20inquire%20about%20your%20tours." target="_blank" class="whatsapp-float" aria-label="WhatsApp"><svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg></a>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/data.js"></script>
  <script>
    function toggleMobileMenu(){document.getElementById('mobile-menu').classList.toggle('open');}
    function observeFadeUps(){var o=new IntersectionObserver(function(e){for(var i=0;i<e.length;i++){if(e[i].isIntersecting){e[i].target.classList.add('visible');o.unobserve(e[i].target);}}},{threshold:0.08});var els=document.querySelectorAll('.fade-up:not(.visible)');for(var i=0;i<els.length;i++)o.observe(els[i]);}

    var params=new URLSearchParams(window.location.search);
    var tourId=parseInt(params.get('id'));
    var tour=null;
    for(var i=0;i<tours.length;i++){if(tours[i].id===tourId){tour=tours[i];break;}}

    if(!tour){
      document.getElementById('tour-hero-title').textContent='Tour Not Found';
      document.getElementById('tour-description').textContent='The tour you are looking for does not exist.';
    } else {
      document.title=tour.title+' — Rahhali Luxury Travel';
      document.getElementById('tour-hero-img').src=tour.image;
      document.getElementById('tour-hero-img').alt=tour.title;
      document.getElementById('tour-hero-subtitle').textContent=tour.subtitle+' \u2014 '+tour.category;
      document.getElementById('tour-hero-title').textContent=tour.title;
      document.getElementById('tour-info-duration').innerHTML='<i data-lucide="clock" class="w-4 h-4 text-gold"></i> '+tour.duration;
      var starsHtml='';for(var s=0;s<5;s++)starsHtml+='<span class="star">\u2605</span>';
      document.getElementById('tour-info-stars').innerHTML=starsHtml;
      document.getElementById('tour-info-price').textContent=tour.price;
      document.getElementById('tour-description').textContent=tour.description;

      document.getElementById('tour-inclusions').innerHTML=incHtml;

      if(tour.itinerary && tour.itinerary.length > 0){
        document.getElementById('tour-itinerary-section').style.display='block';
        var itinHtml='';
        for(var d=0;d<tour.itinerary.length;d++){
          itinHtml+='<div style="display:flex;gap:1rem;margin-bottom:1.5rem;align-items:flex-start;">'
            +'<div style="background:#C8A96E;color:#0A0A0A;padding:0.3rem 0.75rem;border-radius:4px;font-weight:700;white-space:nowrap;font-size:0.75rem;font-family:Lato,sans-serif;min-width:60px;text-align:center;">Day '+tour.itinerary[d].day+'</div>'
            +'<div>'
            +'<p style="color:#E8E2D8;font-weight:700;margin-bottom:0.25rem;font-size:0.9rem;">'+tour.itinerary[d].title+'</p>'
            +'<p style="color:#B8B0A4;font-size:0.85rem;line-height:1.6;">'+tour.itinerary[d].description+'</p>'
            +'</div>'
            +'</div>';
        }
        document.getElementById('tour-itinerary').innerHTML=itinHtml;
      },

      var galleryHtml='';for(var g=0;g<tour.gallery.length;g++){galleryHtml+='<img src="'+tour.gallery[g]+'" alt="'+tour.title+'" class="tour-gallery-img" loading="lazy">';}
      document.getElementById('tour-gallery').innerHTML=galleryHtml;

      var hlHtml='';for(var h=0;h<tour.highlights.length;h++){hlHtml+='<li class="flex items-start gap-2 text-cream-muted text-sm"><span class="text-gold mt-0.5">\u2726</span> '+tour.highlights[h]+'</li>';}
      document.getElementById('tour-highlights').innerHTML=hlHtml;

      var incHtml='';for(var inc=0;inc<tour.inclusions.length;inc++){incHtml+='<li class="flex items-start gap-2 text-cream-muted text-sm"><span class="text-gold mt-0.5">\u2713</span> '+tour.inclusions[inc]+'</li>';}
      document.getElementById('tour-inclusions').innerHTML=incHtml;

      document.getElementById('tour-book-btn').href='booking.html?id='+tour.id;

      // Related tours
      var relatedHtml='';var count=0;
      for(var r=0;r<tours.length&&count<3;r++){
        if(tours[r].id!==tour.id){relatedHtml+='<a href="tour-detail.html?id='+tours[r].id+'" class="tour-card"><div class="card-img"><img src="'+tours[r].image+'" alt="'+tours[r].title+'" loading="lazy"><div class="overlay"></div><div class="card-badge">'+tours[r].category+'</div></div><div class="p-5"><p class="text-gold text-xs font-bold tracking-[0.12em] uppercase mb-1" style="font-size:0.6rem;">'+tours[r].subtitle+'</p><h3 class="font-display text-lg text-white mb-2">'+tours[r].title+'</h3><div class="flex items-center gap-3 text-cream-muted text-sm mb-3"><span class="flex items-center gap-1"><i data-lucide="clock" class="w-3.5 h-3.5"></i> '+tours[r].duration+'</span></div><div class="flex items-center justify-between"><span class="text-gold font-bold text-sm">'+tours[r].price+'</span><span class="text-cream-muted text-xs tracking-wider uppercase flex items-center gap-1">Details <i data-lucide="arrow-right" class="w-3 h-3"></i></span></div></div></a>';count++;}
      }
      document.getElementById('related-tours').innerHTML=relatedHtml;
    }

    window.addEventListener('load',function(){lucide.createIcons();observeFadeUps();});
  </script>
  <script src="js/footer.js"></script>
</body>
</html>
