  <script src="js/data.js"></script>
  <script>
    function toggleMobileMenu(){document.getElementById('mobile-menu').classList.toggle('open');}
    function observeFadeUps(){var o=new IntersectionObserver(function(e){for(var i=0;i<e.length;i++){if(e[i].isIntersecting){e[i].target.classList.add('visible');o.unobserve(e[i].target);}}},{threshold:0.08,rootMargin:'0px 0px -40px 0px'});var els=document.querySelectorAll('.fade-up:not(.visible)');for(var i=0;i<els.length;i++)o.observe(els[i]);}
    window.addEventListener('load',function(){lucide.createIcons();observeFadeUps();});
    function renderTourCard(t){return '<a href="tour-detail.html?id='+t.id+'" class="tour-card"><div class="card-img"><img src="'+t.image+'" alt="'+t.title+'" loading="lazy"><div class="overlay"></div><div class="card-badge">'+t.category+'</div></div><div class="p-5"><p class="text-gold text-xs font-bold tracking-[0.12em] uppercase mb-1" style="font-size:0.6rem;">'+t.subtitle+'</p><h3 class="font-display text-lg text-white mb-2">'+t.title+'</h3><div class="flex items-center gap-3 text-cream-muted text-sm mb-3"><span class="flex items-center gap-1"><i data-lucide="clock" class="w-3.5 h-3.5"></i> '+t.duration+'</span></div><div class="flex items-center justify-between"><span class="text-gold font-bold text-sm">'+t.price+'</span><span class="text-cream-muted text-xs tracking-wider uppercase flex items-center gap-1">Details <i data-lucide="arrow-right" class="w-3 h-3"></i></span></div></div></a>';}
    function renderAllTours(filter){filter=filter||'all';var html='';for(var i=0;i<tours.length;i++){if(filter==='all'||tours[i].category===filter)html+=renderTourCard(tours[i]);}document.getElementById('tours-grid').innerHTML=html;lucide.createIcons();}
    function filterTours(cat,btn){var tabs=document.querySelectorAll('.filter-tab');for(var i=0;i<tabs.length;i++)tabs[i].classList.remove('active');if(btn)btn.classList.add('active');renderAllTours(cat);}
    renderAllTours();
  </script>
